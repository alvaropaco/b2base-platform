name: conversational-evals

on:
  workflow_dispatch:
    inputs:
      eval_url:
        description: "Base URL for a deployed test/staging environment"
        required: true
        type: string
      threshold:
        description: "Minimum deterministic overall score"
        required: false
        default: "85"
        type: string
      judge:
        description: "Run LLM-as-a-Judge"
        required: false
        default: false
        type: boolean
      judge_threshold:
        description: "Minimum LLM-as-a-Judge score (0-10)"
        required: false
        default: "7"
        type: string

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run conversational evaluation
        env:
          B2BASE_EVAL_URL: ${{ inputs.eval_url }}
          B2BASE_EVAL_THRESHOLD: ${{ inputs.threshold }}
          B2BASE_EVAL_JUDGE: ${{ inputs.judge }}
          B2BASE_EVAL_JUDGE_THRESHOLD: ${{ inputs.judge_threshold }}
          B2BASE_EVAL_ORG_ID: eval-org
          LITELLM_URL: ${{ secrets.B2BASE_LITELLM_URL }}
          LITELLM_API_KEY: ${{ secrets.B2BASE_LITELLM_API_KEY }}
          LITELLM_MODEL: ${{ secrets.B2BASE_LITELLM_MODEL }}
          B2BASE_EVAL_EMAIL: ${{ secrets.B2BASE_EVAL_EMAIL }}
          B2BASE_EVAL_PASSWORD: ${{ secrets.B2BASE_EVAL_PASSWORD }}
        run: pnpm run eval:chat
