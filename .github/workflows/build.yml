# Build & deploy — padrão GitOps do cluster (ver AGENTS.md do k8s-infra):
#   1. Builda a imagem e pusha no GHCR (ghcr.io/alvaropaco/b2base-platform).
#   2. Faz o write-back da tag no apps/b2base/values.yaml do k8s-infra
#      (branch master — a que o ArgoCD rastreia).
#   3. ArgoCD detecta (~3min) e sincroniza o cluster.
#
# Secrets necessários (Settings → Secrets → Actions):
#   GH_PAT                  — PAT com `repo` (k8s-infra) + `write:packages`,
#                             usado no job de write-back. Sem ele a imagem é
#                             buildada, mas a tag não é propagada.
#   VITE_FIREBASE_*         — (opcional) config do Firebase Web SDK, inlined no
#                             bundle em build-time (ver Dockerfile).
name: build-and-deploy

on:
  push:
    branches: [main]
    # Monorepo: mudanças só nos serviços Python (ou docs) não rebuildam a
    # imagem da plataforma. Cada serviço tem seu workflow dedicado.
    paths-ignore:
      - "services/**"
      - "*.md"
      - "docs/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/alvaropaco/b2base-platform

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short sha
        id: meta
        run: |
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "shashort=${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ steps.meta.outputs.shashort }}
            ${{ env.IMAGE_NAME }}:latest

  bump-k8s-infra:
    runs-on: ubuntu-latest
    needs: build-push
    permissions:
      contents: write
    steps:
      - name: Compute short sha
        id: meta
        run: |
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "shashort=${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Checkout k8s-infra
        uses: actions/checkout@v4
        with:
          repository: alvaropaco/k8s-infra
          token: ${{ secrets.GH_PAT }}
          path: k8s-infra

      - name: Bump image tag in values.yaml
        working-directory: k8s-infra
        run: |
          VALUES="apps/b2base/values.yaml"
          SHORT="${{ steps.meta.outputs.shashort }}"
          sed -i "s|^  repository: .*|  repository: ghcr.io/alvaropaco/b2base-platform|" "$VALUES"
          sed -i "s|^  tag: .*|  tag: sha-${SHORT}|" "$VALUES"
          git diff -- "$VALUES"

      - name: Commit and push (master = ArgoCD default branch)
        working-directory: k8s-infra
        run: |
          git config user.name "b2base-ci"
          git config user.email "ci@0xcloud.net"
          if git diff --quiet apps/b2base/values.yaml; then
            echo "values.yaml unchanged; skip"
          else
            git add apps/b2base/values.yaml
            git commit -m "b2base: bump image tag to sha-${{ steps.meta.outputs.shashort }} [skip ci]"
            git push origin HEAD:master
          fi

  # QA 2026-10-05 (incidente de 5 dias): tag commitada no k8s-infra ≠ pod
  # atualizado — o ArgoCD deixou de aplicar e o /api/version continuou num sha
  # de 30/09 enquanto TODOS os releases liam "success". Este job fecha o
  # circuito: o release só é verde se o GIT_SHA NO AR for este commit (ou um
  # descendente direto). Endpoint público (/api/version é pré-auth).
  verify-rollout:
    runs-on: ubuntu-latest
    needs: [build-push, bump-k8s-infra]
    steps:
      - name: Prepara acesso à VPS (ponte de verificação quando a borda bloqueia runners)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$VPS_SSH_KEY" ]; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
            chmod 600 ~/.ssh/vps_key
            ssh-keyscan -t ed25519 -H "${VPS_HOST:-157.173.121.7}" >> ~/.ssh/known_hosts 2>/dev/null
            echo "VERIFY_VIA_VPS=1" >> "$GITHUB_ENV"
            echo "Verificação via VPS ($VPS_HOST) ativada."
          else
            echo "VERIFY_VIA_VPS=0" >> "$GITHUB_ENV"
            echo "::warning::Secret VPS_SSH_KEY ausente — verificação direta do runner (pode ser bloqueada pela borda)."
          fi
      - name: Poll /api/version até o rollout chegar (teto 15 min)
        env:
          EXPECTED: ${{ github.sha }}
          PROD_URL: https://www.b2base.net
          VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
        run: |
          DEADLINE=$(( $(date +%s) + 900 ))
          RUNNING=""
          read_version() {
            if [ "$VERIFY_VIA_VPS" = "1" ]; then
              ssh -i ~/.ssh/vps_key -o BatchMode=yes -o ConnectTimeout=12 "root@${VPS_HOST:-157.173.121.7}" \
                "curl -s -m 10 $PROD_URL/api/version" 2>/dev/null \
                | python3 -c 'import json,sys;print(json.load(sys.stdin)["data"]["sha"] or "")' 2>/dev/null || true
            else
              HTTP=$(curl -s -m 10 -o /tmp/version.json -w "%{http_code}" \
                -A "Mozilla/5.0 (X11; Linux x86_64) b2base-verify/1.0" \
                -H "Accept: application/json" "$PROD_URL/api/version" || echo "curl_failed")
              if [ "$HTTP" = "200" ]; then
                python3 -c 'import json;print(json.load(open("/tmp/version.json"))["data"]["sha"] or "")' 2>/dev/null || true
              else
                echo ""
              fi
            fi
          }
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            RUNNING=$(read_version)
            if [ -n "$RUNNING" ]; then
              if [ "$RUNNING" = "$EXPECTED" ]; then
                echo "Rollout confirmado: produção em $RUNNING"
                exit 0
              fi
              # Um sha NOVO (descendente deste commit) também é sucesso —
              # deploys encadeados podem ultrapassar este.
              if git fetch --quiet origin "$RUNNING" 2>/dev/null && git merge-base --is-ancestor "$EXPECTED" "$RUNNING" 2>/dev/null; then
                echo "Rollout confirmado (commit descendente): produção em $RUNNING"
                exit 0
              fi
              echo "Produção ainda em ${RUNNING:0:7} — aguardando rollout..."
            else
              if [ "$VERIFY_VIA_VPS" != "1" ]; then
                echo "::warning::Runner não alcança www.b2base.net (borda bloqueia faixas de runner). Adicione o secret VPS_SSH_KEY (chave privada com acesso à VPS) para verificar via ponte SSH."
              fi
              echo "/api/version indisponível — tentando de novo..."
            fi
            sleep 30
          done
          echo "::error::DEPLOY NÃO CHEGOU AO CLUSTER em 12 min. Imagem sha-$EXPECTED_SHORT buildada e tag commitada no k8s-infra, mas produção segue em '${RUNNING:0:7}'. Verifique o app do ArgoCD (sync/erro) — NUNCA considere este release válido."
          exit 1
