[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cnpj-data-publisher"
version = "0.1.0"
description = "Publishes Brazilian CNPJ open-data company events to NATS JetStream"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "cnpj-data-publisher maintainers" }]
keywords = ["cnpj", "receita-federal", "open-data", "nats", "jetstream", "etl"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Database",
]
dependencies = [
    "duckdb>=1.1.0,<2.0",
    "pyarrow>=17.0.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary,pool]>=3.2.0",
    "alembic>=1.13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "typer>=0.12.0",
    "httpx[http2]>=0.27.0",
    "nats-py>=2.7.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.20.0",
    "tenacity>=8.5.0",
    "rich>=13.7.0",
    "jsonschema>=4.23.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
    "testcontainers[postgres]>=4.8.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "types-jsonschema>=4.23.0",
    "boto3-stubs[s3]>=1.34.0",
]
otel = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
]
gcs = [
    "google-cloud-storage>=2.18.0",
]

[project.scripts]
cnpj-data-publisher = "cnpj_data_publisher.cli:main"

[project.urls]
Repository = "https://github.com/alvaropaco/codename-sales-intel/tree/main/services/cnpj-data-publisher"

[tool.hatch.build.targets.wheel]
packages = ["src/cnpj_data_publisher"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "migrations",
    "contracts",
    "helm",
    "tests",
    "docker-compose.yml",
    "Dockerfile",
    "Makefile",
    "README.md",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "PIE", "RET", "PTH", "T20"]
ignore = ["E501", "B008", "N818", "RET504"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["T20", "S101"]
"scripts/**" = ["T20"]
"migrations/**" = ["N999", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["cnpj_data_publisher"]
known-local-folder = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "duckdb.*",
    "nats.*",
    "testcontainers.*",
    "boto3.*",
    "botocore.*",
    "pyarrow.*",
    "google.cloud.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "migrations.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --tb=short --import-mode=importlib"
pythonpath = ["."]
timeout = 600
markers = [
    "unit: fast isolated tests",
    "integration: tests requiring real containers",
    "e2e: full pipeline tests",
    "performance: synthetic dataset benchmarks",
    "slow: long running tests",
]

[tool.coverage.run]
source = ["src/cnpj_data_publisher"]
branch = true
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "if __name__ == .__main__.:",
]
